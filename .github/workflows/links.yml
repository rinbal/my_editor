name: Links

# Every relative link and anchor in the Markdown files must lead somewhere.
# Offline: web addresses are not checked, so a site that is down never
# fails a pull request.

on:
  push:
    branches: [main, dev]
    paths: ["**/*.md", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links in the Markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            './**/*.md'
          fail: true
